name: Linux cross-platform packages
on:
    workflow_call:
        inputs:
            commit: { required: true, type: string }
            mode: { required: true, type: string }
            macos_intel: { required: false, type: boolean, default: false }
permissions:
    contents: read
jobs:
    packages:
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !github.event.created)) && inputs.commit == github.sha && (github.ref == 'refs/heads/package-build' || github.ref == 'refs/heads/release') && inputs.mode == 'build-only'
        runs-on: ${{ vars.LINUX_RUNNER_LABELS != '' && fromJSON(vars.LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
        env:
            RELEASE_REPOSITORY: ${{ github.repository }}
            RELEASE_COMMIT: ${{ inputs.commit }}
            PLUGIN_MACOS_INTEL: ${{ inputs.macos_intel && '1' || '0' }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ inputs.commit }}
                  persist-credentials: false
            - uses: actions/setup-go@v7.0.0
              with: { go-version: '1.27.4' }
            - uses: actions/setup-python@v7.1.0
              with: { python-version: '3.12' }
            - run: python scripts/go_modules.py --github-env "$GITHUB_ENV"
            - uses: actions/cache@v6.1.0
              with:
                  path: dist/bin
                  key: plugins-cross-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'tools/pluginbuild/**', 'internal/**', 'plugins/**') }}
                  restore-keys: plugins-cross-${{ runner.os }}-
            - name: Cross-compile and package every supported OS
              run: |
                  go run ./tools/pluginbuild package --os linux
                  go run ./tools/pluginbuild package --os windows
                  go run ./tools/pluginbuild package --os darwin
                  python scripts/validate_packages.py --all-platforms
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: plugins-native-linux
                  path: |
                      dist/packages/linux/*.zip
                      dist/catalog-linux.json
                  if-no-files-found: error
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: plugins-native-windows
                  path: |
                      dist/packages/windows/*.zip
                      dist/catalog-windows.json
                  if-no-files-found: error
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: plugins-native-darwin
                  path: |
                      dist/packages/darwin/arm64/*.zip
                      ${{ inputs.macos_intel && 'dist/packages/darwin/amd64/*.zip' || '' }}
                      dist/catalog-macos.json
                  if-no-files-found: error
