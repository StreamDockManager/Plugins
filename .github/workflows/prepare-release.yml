name: Prepare Release
on:
    workflow_dispatch:
        inputs:
            runner_service:
                description: Runner service
                type: choice
                options: [github, blacksmith]
                default: github
            channel:
                type: choice
                options: [stable, development]
                default: stable
            macos_intel:
                description: Include optional Intel macOS packages
                type: boolean
                default: false
permissions:
    contents: read
concurrency:
    group: plugins-prepare-release
    cancel-in-progress: false
jobs:
    prepare:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        runs-on: ${{ inputs.runner_service == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER_LABELS != '' && fromJSON(vars.LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
        timeout-minutes: 55
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-go@v7.1.0
              with: { go-version: '1.27.4' }
            - uses: actions/setup-python@v7.1.0
              with: { python-version: '3.12' }
            - name: Test exact source and prepare all packages once
              env:
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_REPOSITORY: ${{ github.repository }}
                  MACOS_INTEL: ${{ inputs.macos_intel }}
              shell: bash
              run: |
                  set -euo pipefail
                  python3 scripts/go_modules.py --github-env "$GITHUB_ENV"
                  # Use the same public dependency settings for tests and packaging
                  python3 scripts/prepare_ci.py
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: prepared-plugin-release
                  path: dist/github-release-bundle/
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 14
            - name: Preparation summary
              run: |
                  echo '### Ready for Publish Release' >> "$GITHUB_STEP_SUMMARY"
                  echo "Use prepare_run_id: $GITHUB_RUN_ID. Packages are not yet published." >> "$GITHUB_STEP_SUMMARY"
