name: Publish Release
on:
    workflow_dispatch:
        inputs:
            prepare_run_id:
                description: Successful Prepare Release run ID (unexpired artifact)
                required: true
                type: string
permissions:
    contents: read
concurrency:
    group: plugins-publish-release
    cancel-in-progress: false
jobs:
    publish:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        permissions:
            actions: read
            contents: write
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v7.1.0
              with: { python-version: '3.12' }
            - name: Verify successful preparation and publish identical bytes
              env:
                  GH_TOKEN: ${{ github.token }}
                  PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
                  RELEASE_REPOSITORY: ${{ github.repository }}
              shell: bash
              run: |
                  set -euo pipefail
                  python3 scripts/prepared_release.py fetch --repository "$RELEASE_REPOSITORY" --run-id "$PREPARE_RUN_ID" --output dist/verified-preparation
                  python3 scripts/github_release.py publish --directory dist/verified-preparation --repository "$RELEASE_REPOSITORY"
