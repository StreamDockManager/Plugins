name: checks
on:
    push:
        branches: [test-build]
    workflow_dispatch:
        inputs:
            macos_intel:
                description: Also cross-compile optional Intel macOS plugins
                type: boolean
                default: false
    workflow_call:
        inputs:
            release_checks: { required: true, type: boolean }
            commit: { required: true, type: string }
            macos_intel: { required: false, type: boolean, default: false }
permissions:
    contents: read
concurrency:
    group: plugins-tests-${{ github.ref }}-${{ github.ref == 'refs/heads/release' && github.run_id || 'latest' }}
    cancel-in-progress: ${{ github.ref == 'refs/heads/test-build' }}
jobs:
    dependency-security:
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !github.event.created)) && (inputs.commit == '' || inputs.commit == github.sha) && (github.ref == 'refs/heads/test-build' || (github.ref == 'refs/heads/release' && inputs.release_checks && inputs.commit == github.sha))
        runs-on: ${{ vars.LINUX_RUNNER_LABELS != '' && fromJSON(vars.LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version: '1.27.4'
            - run: python3 scripts/go_modules.py --github-env "$GITHUB_ENV"
            - run: go mod verify
            - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
    go:
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !github.event.created)) && (inputs.commit == '' || inputs.commit == github.sha) && (github.ref == 'refs/heads/test-build' || (github.ref == 'refs/heads/release' && inputs.release_checks && inputs.commit == github.sha))
        runs-on: ${{ vars.LINUX_RUNNER_LABELS != '' && fromJSON(vars.LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
        env:
            PLUGIN_MACOS_INTEL: ${{ inputs.macos_intel && '1' || '0' }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version: '1.27.4'
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.12'
            - run: python scripts/go_modules.py --github-env "$GITHUB_ENV"
            - run: python scripts/release.py version
            - run: python -m compileall -q scripts
            - name: Go formatting
              shell: bash
              run: |
                  files=$(git ls-files --cached --others --exclude-standard -- '*.go')
                  unformatted=$(printf '%s\n' "$files" | while IFS= read -r file; do [ -z "$file" ] || gofmt -l "$file"; done)
                  if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '26'
            - run: npm install --global npm@12.2.2
            - run: go vet ./...
            - run: go build ./...
            - run: go run ./tools/pluginbuild cross
